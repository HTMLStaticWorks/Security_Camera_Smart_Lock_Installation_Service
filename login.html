<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - Vigilant Smart Installations</title>
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/animations.css">
  
  <style>
    .auth-layout {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--color-navy), var(--color-primary-dark));
      padding: var(--space-sm);
    }

    .auth-card {
      background: var(--bg-card);
      width: 100%;
      max-width: 450px;
      padding: var(--space-xl) var(--space-lg);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 2rem;
      color: var(--text-main);
      margin-bottom: var(--space-sm);
      text-decoration: none;
    }

    .auth-logo span {
      color: var(--color-primary);
    }

    .auth-subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: var(--space-lg);
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: var(--text-main);
    }

    .auth-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      font-size: 0.9rem;
    }

    .auth-options label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      color: var(--text-muted);
    }

    .auth-footer {
      margin-top: 25px;
      text-align: center;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- Ensure AppHeader/Footer scripts exist but we use no-header/no-footer attributes to hide them if they were injected, but actually we just won't include the custom elements -->
  
  <div class="auth-layout">
    <div class="auth-card animate-fade-in">
      
      <!-- Back to home link absolute -->
      <a href="index.html" style="position: absolute; top: 20px; left: 20px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; font-size: 0.9rem;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Home
      </a>

      <!-- Theme Toggle Absolute -->
      <button id="theme-toggle" style="position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--text-main); cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>

      <a href="index.html" class="auth-logo">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        Vigilant
      </a>
      
      <p class="auth-subtitle">Welcome back! Please enter your details.</p>

      <form onsubmit="event.preventDefault(); window.location.href='index.html';">
        <div class="form-group" style="margin-bottom: 20px;">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" required placeholder="Enter your email">
        </div>
        
        <div class="form-group" style="margin-bottom: 15px;">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" required placeholder="••••••••">
        </div>

        <div class="auth-options">
          <label>
            <input type="checkbox" id="remember">
            Remember me
          </label>
          <a href="#" style="color: var(--color-primary); font-weight: 500;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 14px;">Sign in</button>
      </form>

      <div class="auth-footer">
        <span style="color: var(--text-muted);">Don't have an account?</span> 
        <a href="signup.html" style="font-weight: 600;">Sign up</a>
      </div>
    </div>
  </div>

  <script>
    // Minimal logic for Theme toggle just for auth pages
    document.addEventListener('DOMContentLoaded', () => {
      const themeBtn = document.getElementById('theme-toggle');
      const htmlEl = document.documentElement;
      let currentTheme = localStorage.getItem('theme') || 'light';
      htmlEl.setAttribute('data-theme', currentTheme);
      
      const sunIcon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
      const moonIcon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
      
      if(themeBtn) themeBtn.innerHTML = currentTheme === 'light' ? moonIcon : sunIcon;

      if (themeBtn) {
        themeBtn.addEventListener('click', () => {
          currentTheme = currentTheme === 'light' ? 'dark' : 'light';
          htmlEl.setAttribute('data-theme', currentTheme);
          localStorage.setItem('theme', currentTheme);
          themeBtn.innerHTML = currentTheme === 'light' ? moonIcon : sunIcon;
        });
      }
    });
  </script>
</body>
</html>
