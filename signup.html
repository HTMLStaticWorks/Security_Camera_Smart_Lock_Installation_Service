<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sign Up - Vigilant Smart Installations</title>
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/animations.css">
  
  <style>
    .auth-layout {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-main);
      padding: var(--space-md) var(--space-sm);
      transition: background-color var(--transition-normal);
    }

    .auth-card {
      background: var(--bg-card);
      width: 100%;
      max-width: 480px;
      padding: var(--space-lg);
      border-radius: 24px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    .auth-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-md);
    }

    .auth-home-btn {
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      padding: 8px 16px;
      background: rgba(148, 163, 184, 0.15);
      border-radius: 20px;
      transition: all var(--transition-fast);
    }

    .auth-home-btn:hover {
      background: rgba(148, 163, 184, 0.3);
    }

    .auth-top-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .auth-icon-btn {
      background: rgba(148, 163, 184, 0.15);
      border: none;
      color: var(--text-main);
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }
    
    .auth-icon-btn:hover {
      background: rgba(148, 163, 184, 0.3);
      transform: translateY(-2px);
    }

    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 2rem;
      color: var(--text-main);
      margin-bottom: 10px;
      text-decoration: none;
    }

    .auth-logo span {
      color: var(--color-primary);
    }

    .auth-subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: var(--space-md);
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: var(--text-main);
    }

    .auth-footer {
      margin-top: 25px;
      text-align: center;
      font-size: 0.95rem;
    }

    @media (max-width: 576px) {
      .auth-layout {
        padding: 15px;
      }

      .auth-card {
        padding: 20px 16px;
        border-radius: 20px;
      }

      .auth-home-btn {
        font-size: 0.85rem;
        padding: 6px 12px;
      }

      .auth-icon-btn {
        width: 36px;
        height: 36px;
      }
    }
  </style>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563EB' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z'/%3E%3Ccircle cx='12' cy='12' r='3'/%3E%3C/svg%3E">
</head>
<body>

  <div class="auth-layout">
    <div class="auth-card animate-fade-in">
      
      <!-- Inside Card Header -->
      <div class="auth-card-header">
        <a href="index.html" class="auth-home-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Home
        </a>
        <div class="auth-top-controls">
          <button class="auth-icon-btn rtl-toggle" id="rtl-toggle" title="Toggle RTL" aria-label="Toggle RTL">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
          </button>
          <button class="auth-icon-btn theme-toggle" id="theme-toggle" title="Toggle Theme" aria-label="Toggle Theme">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </div>

      <a href="index.html" class="auth-logo">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        Vigilant
      </a>
      
      <p class="auth-subtitle">Create your account to manage your security systems.</p>

      <form onsubmit="event.preventDefault(); window.location.href='index.html';">
        <div class="form-group" style="margin-bottom: 15px;">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" required placeholder="John Doe">
        </div>

        <div class="form-group" style="margin-bottom: 15px;">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" required placeholder="john@example.com">
        </div>

        <div class="form-group" style="margin-bottom: 15px;">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" class="form-control" required placeholder="+1 (555) 000-0000">
        </div>
        
        <div class="form-group" style="margin-bottom: 15px;">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" required placeholder="Create a strong password">
        </div>

        <div class="form-group" style="margin-bottom: 25px;">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" class="form-control" required placeholder="Confirm your password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 14px;">Sign Up</button>
      </form>

      <div class="auth-footer">
        <span style="color: var(--text-muted);">Already have an account?</span> 
        <a href="login.html" style="font-weight: 600;">Sign in</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
